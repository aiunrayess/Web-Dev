<body>

  <main class="container">

    <div class="visual">
      <img src="instagram-logo.png" alt="instagram">
    </div>

    <div class="login-area">
      <h1 class="logo">Instagram</h1>

      <input type="text" placeholder="Phone number, username, or email">
      
      <div class="password-wrapper">
        <input type="password" placeholder="Password">
        <button class="show-btn">Show</button>
      </div>

      <button class="login-btn">Log in</button>

      <div class="divider">
        <span></span>
        <p>OR</p>
        <span></span>
      </div>

      <button class="fb-login">
        <img src="https://www.facebook.com/images/fb_icon_325x325.png" alt="facebook logo" class="fb-logo">
        <a href="https://www.facebook.com/" class="fb">Log in with Facebook</a>
      </button>

      <a href="https://www.instagram.com/accounts/password/reset/" class="forgot" style="font-family: Verdana, sans-serif;">Forgot password?</a>
      <br>
      <p class="signup">
        Don’t have an account? <a href="https://www.instagram.com/accounts/emailsignup/">Sign up</a>
      </p>
    </div>

  </main>
